name: check

# What can be checked without the game: every source is real C/C++ (no assembly posing as C) and
# compiles with the original compiler. Matching itself needs your own executable: run
# `python tools/build.py` locally, which links everything and compares SHA-1 with the original.
# Sources live under src/<subsystem>/<unit>/ (tools/layout.py), new matches may still sit flat in src/.

on:
  push:
  pull_request:

jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime and extraction regression checks
        run: |
          python -m pip install rabbitizer
          python -m unittest discover -s tests -v
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No assembly posing as C
        run: find src -type f \( -name '*.c' -o -name '*.cpp' \) -print0 | xargs -0 python tools/asm_policy.py
      - name: Sources are where tools/layout.py puts them, with their real names
        run: python tools/organize.py --check
      - name: Compilers (ee-gcc 2.96 and the profiles the sources name, project.toml; decomp.me builds)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 binutils-mips-linux-gnu
          python3 tools/install_compilers.py --used src
          find src -type f \( -name '*.c' -o -name '*.cpp' \) > /tmp/sources.txt
      - name: Every source compiles (with the compiler its first line names, else ee-gcc 2.96)
        # from the repository root, so -Iinclude (in every project.toml command) finds include/
        # (m2c_macros.h, types.h, the game headers include/gt4/); CPATH covers any command without it
        run: |
          export CPATH="$PWD/include"
          d=~/.local/share/gt4/ee-gcc2.96
          default="$d/bin/ee-gcc -c -B $d/bin/ee- -O2 -G0 -fno-exceptions -Iinclude"
          python3 - > /tmp/commands.txt <<'EOF'
          import tomllib, os
          for name, c in tomllib.load(open("project.toml", "rb")).get("compilers", {}).items():
              print(name, c["command"].replace("{dir}", os.path.expanduser(c["dir"])).replace("{tools}", os.path.abspath("tools")))
          EOF
          mkdir -p /tmp/obj
          fail=0
          n=0
          while read -r f; do
            name=$(head -n1 "$f" | sed -n 's|^/\* compiler: \([^ ]*\) \*/.*|\1|p')
            cmd="$default"
            if [ -n "$name" ]; then
              cmd=$(grep "^$name " /tmp/commands.txt | cut -d' ' -f2-)
              [ -n "$cmd" ] || { echo "::error file=$f::unknown compiler $name"; fail=1; continue; }
            fi
            n=$((n + 1))
            # eval: a command may quote its own arguments (wrappers such as cc_as.sh)
            eval "$cmd \"\$f\" -o /tmp/obj/$n.o" \
              || { echo "::error file=$f::does not compile"; fail=1; }
          done < /tmp/sources.txt
          echo "$(ls /tmp/obj | wc -l) sources compiled"
          exit $fail
