name: check

# What can be checked without the game: every source is real C/C++ (no assembly posing as C) and
# compiles with the original compiler. Matching itself needs your own executable: run
# `python tools/build.py` locally, which links everything and compares SHA-1 with the original.

on:
  push:
  pull_request:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No assembly posing as C
        run: python tools/asm_policy.py src/*
      - name: Compiler (ee-gcc 2.96, decomp.me build)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 binutils-mips-linux-gnu
          mkdir -p ~/.local/share/gt4/ee-gcc2.96
          curl -sL https://github.com/decompme/compilers/releases/download/compilers/ee-gcc2.96.tar.xz \
            | tar -xJ -C ~/.local/share/gt4/ee-gcc2.96
      - name: Every source compiles
        run: |
          d=~/.local/share/gt4/ee-gcc2.96
          mkdir -p /tmp/obj
          fail=0
          for f in src/func_*; do
            "$d/bin/ee-gcc" -c -B "$d/bin/ee-" -O2 -G0 -fno-exceptions "$f" -o "/tmp/obj/$(basename "${f%.*}").o" \
              || { echo "::error file=$f::does not compile"; fail=1; }
          done
          echo "$(ls /tmp/obj | wc -l) sources compiled"
          exit $fail
